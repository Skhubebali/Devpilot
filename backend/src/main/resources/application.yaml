server:
  port: 8081

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true


  ai:
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-4o-mini
      embedding:
        options:
          model: text-embedding-3-small
    vectorstore:
      pgvector:
        initialize-schema: true
        dimensions: 1536
        index-type: HNSW
        distance-type: COSINE_DISTANCE

  security:
    oauth2:
      client:
        registration:
          github:
            client-id: ${GITHUB_CLIENT_ID}
            client-secret: ${GITHUB_CLIENT_SECRET}



app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

  token-encrytor-password: ${TOKEN_ENCRYPTOR_PASSWORD}
  token-encrytor-salt: ${TOKEN_ENCRYPTOR_SALT}

  indexing:
    max-file-bytes: 102400
    chunk-size: 800
    chunk-overlap: 100

  github:
    api-delay-ms: 50

  services:
    postgres:
      image: pgvector/pgvector:pg16
      container_name: devpiolet-postgres

      environment:
        POSTGRES_DB: devpiolet
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres

      ports:
        - "5433:5432"

      volumes:
        - devpiolet_pg_data:/var/lib/postgresql/data
        - ./docker/postgres/init-extensions.sql:/docker-entrypoint-initdb.d/01-extensions.sql:ro

      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U postgres -d devpiolet" ]
        interval: 5s
        timeout: 5s
        retries: 5

  volumes:
    devpiolet_pg_data: